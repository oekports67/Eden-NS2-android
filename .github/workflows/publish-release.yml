name: Publish Windows build to a release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of a successful 'Build Windows EXE' run"
        required: true
      tag:
        description: "Existing release tag to attach the build to"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: Eden-NS2-Windows
        path: Eden-NS2-Windows
        run-id: ${{ inputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Package
      run: |
        cd Eden-NS2-Windows
        zip -r -9 "../Eden-NS2-Windows-x64-${{ inputs.tag }}.zip" .

    - name: Attach to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ inputs.tag }}" "Eden-NS2-Windows-x64-${{ inputs.tag }}.zip" \
          --repo "${{ github.repository }}" --clobber
